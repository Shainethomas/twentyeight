  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .glass {
      background: linear-gradient(180deg, rgba(48,26,14,.9), rgba(20,11,5,.94));
      border: 1px solid rgba(217,170,87,.28);
      box-shadow: inset 0 1px 0 rgba(255,226,168,.14), 0 6px 18px rgba(0,0,0,.5);
    }
    .mode {
      position: relative; overflow: hidden; border-radius: 18px; padding: 15px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 13px; transition: transform .14s, box-shadow .16s;
    }
    .mode:hover { transform: translateY(-2px); }
    .mode-ico {
      flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, rgba(255,231,175,.2), rgba(120,78,26,.28));
      border: 1px solid rgba(217,170,87,.34);
    }
    .navb {
      flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; padding: 4px 0;
    }
    .navlbl { font: 700 8.5px/1 Manrope, sans-serif; letter-spacing: .1em; color: rgba(243,228,196,.44); }
    .navlbl-on { color: var(--g); }
    @keyframes sweep { 0%,58% { left: -60%; } 100% { left: 130%; } }
    @keyframes bob { 50% { transform: translateY(-4px); } }
  </style>
</helmet>
