<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #F0B33C; } a:hover { color: #FFD98A; }
    .t28 * { box-sizing: border-box; }
    .t28 { -webkit-font-smoothing: antialiased; }
    .num { font-variant-numeric: tabular-nums; }

    /* ---------- wood ground ---------- */
    .wood {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(92deg, rgba(0,0,0,.26) 0 2px, rgba(255,206,142,.05) 2px 6px, rgba(0,0,0,.14) 6px 11px, rgba(0,0,0,0) 11px 19px),
        repeating-linear-gradient(88deg, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 9px),
        linear-gradient(176deg, #2A1810 0%, #4A2C1B 28%, #56341F 52%, #3A2214 82%, #241409 100%);
    }

    /* ---------- header ---------- */
    .hbtn {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: linear-gradient(180deg, #6A4522, #3E2612);
      box-shadow: inset 0 1px 0 rgba(255,214,150,.26), 0 3px 8px rgba(0,0,0,.6);
    }

    /* ---------- table ---------- */
    .rail {
      position: absolute; border-radius: 50%;
      background: linear-gradient(174deg, #2A1C14 0%, #191008 46%, #241710 100%);
      box-shadow: 0 22px 46px rgba(0,0,0,.72), inset 0 2px 2px rgba(255,214,150,.1);
      padding: 15px;
    }
    .felt {
      position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      background: radial-gradient(72% 52% at 50% 34%, #5FA036 0%, #4C8429 42%, #3B6A20 74%, #2E561A 100%);
      box-shadow: inset 0 6px 18px rgba(0,0,0,.34), inset 0 -8px 20px rgba(0,0,0,.28);
    }
    .felt::after {
      content: ""; position: absolute; inset: 0; opacity: .55; mix-blend-mode: overlay;
      background-image:
        radial-gradient(rgba(255,255,255,.1) .6px, transparent .7px),
        radial-gradient(rgba(0,0,0,.14) .5px, transparent .6px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 2px 1px;
    }
    .dash {
      position: absolute; inset: 18px; border-radius: 50%; pointer-events: none;
      border: 1.5px dashed rgba(255,231,164,.5);
    }

    /* ---------- seats ---------- */
    .seat { position: absolute; display: flex; flex-direction: column; align-items: center; }
    .sname {
      font: 800 13px/1 Manrope, sans-serif; color: #FFFFFF; margin-bottom: 5px;
      text-shadow: 0 2px 5px rgba(0,0,0,.8);
    }
    .av { position: relative; width: 66px; height: 66px; border-radius: 50%; }
    .av-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: linear-gradient(180deg, #FFF6E2, #E4D3B2);
      box-shadow: 0 4px 12px rgba(0,0,0,.6);
    }
    .av-in {
      position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
      background: radial-gradient(78% 68% at 50% 16%, #F3D9C4, #E2BFA6);
    }
    .av-turn::before {
      content: ""; position: absolute; inset: -6px; border-radius: 50%;
      background: conic-gradient(#F5C43B 0turn .72turn, rgba(0,0,0,0) .72turn 1turn);
      -webkit-mask: radial-gradient(circle, transparent 0 33px, #000 33.6px);
      mask: radial-gradient(circle, transparent 0 33px, #000 33.6px);
      animation: spin 5.5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* ---------- score readout ---------- */
    .score {
      position: absolute; display: grid; grid-template-columns: auto 12px auto; gap: 7px 0;
      align-items: baseline;
    }
    .slabel { font: 800 15.5px/1.2 Manrope, sans-serif; color: #FFFFFF; text-shadow: 0 2px 5px rgba(0,0,0,.75); }
    .slabel-call { color: #F5C43B; }
    .scolon { font: 800 15.5px/1.2 Manrope, sans-serif; color: #FFFFFF; text-align: center; text-shadow: 0 2px 5px rgba(0,0,0,.75); }
    .sval { font: 800 15.5px/1.2 Manrope, sans-serif; color: #FFFFFF; padding-left: 14px; text-shadow: 0 2px 5px rgba(0,0,0,.75); }

    /* ---------- cards ---------- */
    .pc {
      position: absolute; border-radius: 6px; overflow: hidden; background: #FDFCF8;
      box-shadow: 0 5px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(60,48,34,.22);
    }
    .pc-idx { position: absolute; left: 4px; top: 2px; display: flex; flex-direction: column; align-items: center; gap: 0; }
    .pc-idx-b { position: absolute; right: 4px; bottom: 2px; display: flex; flex-direction: column; align-items: center; gap: 0; transform: rotate(180deg); }
    .pc-r { font: 800 18px/1.05 Manrope, sans-serif; letter-spacing: -.03em; }
    .pc-r.ten { font-size: 15px; }
    .pc-big { position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%); }

    .hand { position: absolute; left: 8px; right: 8px; bottom: 0; height: 112px; }
    .hc { cursor: pointer; transition: transform .16s cubic-bezier(.22,1,.3,1), box-shadow .16s, filter .16s; }
    .hc-dim { filter: grayscale(.72) brightness(.72); }
    .hc-sel { transform: translateY(-16px); box-shadow: 0 14px 22px rgba(0,0,0,.6), 0 0 0 2px #F5C43B, 0 0 18px rgba(245,196,59,.6); }

    /* ---------- chrome ---------- */
    .turnpill {
      padding: 11px 30px 12px; border-radius: 12px; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #F7BE4C 0%, #E59A32 52%, #C97A22 100%);
      box-shadow: 0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.55);
      font: 800 17px/1 Manrope, sans-serif; color: #FFFFFF; text-shadow: 0 1px 2px rgba(120,60,10,.6);
    }
    .dbtn {
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #FFFFFF, #DCD3C4); color: #2A1C10;
      font: 800 13px/1 Manrope, sans-serif; box-shadow: 0 3px 8px rgba(0,0,0,.55);
    }
    .trumplbl { font: 800 12.5px/1 Manrope, sans-serif; color: #FFFFFF; text-shadow: 0 2px 5px rgba(0,0,0,.8); }
    .trumpback {
      width: 46px; height: 64px; border-radius: 6px; position: relative; overflow: hidden;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.09) 0 3px, rgba(0,0,0,0) 3px 7px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.09) 0 3px, rgba(0,0,0,0) 3px 7px),
        linear-gradient(170deg, #1E5F55, #0E3A34);
      box-shadow: 0 5px 14px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.9);
      animation: trumpglow 2.2s ease-in-out infinite;
    }
    @keyframes trumpglow {
      0%,100% { box-shadow: 0 5px 14px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.9), 0 0 0 rgba(245,196,59,0); }
      50%     { box-shadow: 0 5px 14px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.9), 0 0 20px rgba(245,196,59,.7); }
    }
    @keyframes dealin { from { opacity: 0; transform: translate(0,-300px) rotate(-18deg) scale(.7); } }
  </style>
</helmet>

      <div class="pc-idx-b"><span class="pc-r" style="color:#C8323E">Q</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#C8323E"><use href="#sp-d"></use></svg></div>
    </div>
  </div>

  <!-- ============ SEATS ============ -->
  <div class="seat" style="left: 50%; top: 180px; transform: translateX(-50%);">
    <span class="sname">Top</span>
    <div class="av"><div class="av-ring"></div><div class="av-in"><svg viewBox="0 0 100 100" width="66" height="66"><use href="#ch-colonel"></use></svg></div></div>
  </div>

  <div class="seat" style="left: 2px; top: 322px;">
    <span class="sname">Left</span>
    <div class="av"><div class="av-ring"></div><div class="av-in"><svg viewBox="0 0 100 100" width="66" height="66"><use href="#ch-shark"></use></svg></div></div>
  </div>

  <div class="seat" style="right: 2px; top: 322px;">
    <span class="sname">Right</span>
    <div class="av av-turn"><div class="av-ring"></div><div class="av-in"><svg viewBox="0 0 100 100" width="66" height="66"><use href="#ch-hotshot"></use></svg></div></div>
  </div>

  <div class="dbtn" style="position: absolute; right: 78px; top: 412px;">D</div>

  <!-- ============ TRUMP ============ -->
  <div style="position: absolute; right: 16px; top: 432px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
    <span class="trumplbl">Trump</span>
    <div class="trumpback"></div>
  </div>

  <!-- ============ YOUR TURN ============ -->
  <div style="position: absolute; left: 50%; top: 516px; transform: translateX(-50%);">
    <div class="turnpill">Your Turn</div>
  </div>

  <!-- ============ HAND ============ -->
  <div class="hand" style="bottom: 124px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
      <div class="{{c.cls}}" style="{{c.style}}" onClick="{{c.pick}}">
        <div class="pc-idx"><span class="{{c.rcls}}" style="color: {{c.color}}">{{c.r}}</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="{{c.color}}"><use href="{{c.sym}}"></use></svg></div>
        <svg class="pc-big" width="34" height="34" viewBox="0 0 24 24" fill="{{c.color}}"><use href="{{c.sym}}"></use></svg>
        <div class="pc-idx-b"><span class="{{c.rcls}}" style="color: {{c.color}}">{{c.r}}</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="{{c.color}}"><use href="{{c.sym}}"></use></svg></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 6 }; }

  renderVals() {
    const red = '#C8323E', ink = '#1A1512';

    // lead suit is diamonds, so only diamonds are legal
    const hand = [
      { r: 'J',  s: 's' }, { r: '10', s: 's' },
      { r: 'J',  s: 'h' }, { r: '10', s: 'h' },
      { r: '9',  s: 'c' }, { r: 'Q',  s: 'c' },
      { r: 'K',  s: 'd' }, { r: '8',  s: 'd' }
    ];
    const stride = 42, w = 80;

    const cards = hand.map((c, i) => {
      const legal = c.s === 'd';
      const sel = this.state.picked === i && legal;
      let cls = 'pc hc';
      if (!legal) cls += ' hc-dim';
      if (sel) cls += ' hc-sel';
      return {
        r: c.r,
        sym: '#sp-' + c.s,
        color: (c.s === 'h' || c.s === 'd') ? red : ink,
        rcls: c.r === '10' ? 'pc-r ten' : 'pc-r',
        cls,
        style: 'width:' + w + 'px;height:112px;left:' + (i * stride) + 'px;bottom:0;z-index:' + (i + 1) +
               ';animation:dealin .46s cubic-bezier(.2,.9,.25,1) ' + (i * 0.05).toFixed(2) + 's backwards',
        pick: legal ? () => this.setState({ picked: sel ? -1 : i }) : () => {}
      };
    });

    return { cards };
  }
}
</script>
</body>
</html>
