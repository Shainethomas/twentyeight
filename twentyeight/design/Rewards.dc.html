<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .day {
      position: relative; border-radius: 15px; padding: 10px 5px 9px; min-height: 92px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px;
      background: linear-gradient(180deg, rgba(48,26,14,.86), rgba(20,11,5,.92));
      border: 1px solid rgba(217,170,87,.2);
    }
    .day-done { opacity: .46; }
    .day-live {
      border-color: var(--g);
      background: linear-gradient(165deg, rgba(122,82,28,.92), rgba(34,18,8,.95));
      box-shadow: 0 0 24px rgba(217,170,87,.34), inset 0 1px 0 rgba(255,226,168,.24);
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe { 50% { box-shadow: 0 0 36px rgba(217,170,87,.52), inset 0 1px 0 rgba(255,226,168,.3); } }
    .tick {
      position: absolute; right: 5px; top: 5px; width: 15px; height: 15px; border-radius: 50%;
      background: linear-gradient(180deg,#7ED6A6,#3E9E6B); display: flex; align-items: center; justify-content: center;
    }
    .amt { font: 800 11.5px/1 Manrope, sans-serif; }
    .cta {
      width: 100%; height: 56px; border-radius: 17px; border: 0; cursor: pointer; position: relative; overflow: hidden;
      font: 800 14px/1 Manrope, sans-serif; letter-spacing: .12em;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 42%, #A8741F 100%); color: #2C1705;
      box-shadow: 0 10px 26px rgba(0,0,0,.5), 0 0 30px rgba(217,170,87,.3), inset 0 1px 0 rgba(255,255,255,.65);
    }
    .cta::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 38%; height: 100%;
      background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.62), rgba(255,255,255,0));
      animation: sweep 2.8s ease-in-out infinite;
    }
    @keyframes sweep { 0%,58% { left: -60%; } 100% { left: 130%; } }
    .qrow {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 15px;
      background: linear-gradient(180deg, rgba(48,26,14,.84), rgba(20,11,5,.9));
      border: 1px solid rgba(217,170,87,.18);
    }
    .qico {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, rgba(255,231,175,.16), rgba(120,78,26,.26)); border: 1px solid rgba(217,170,87,.28);
    }
    .bar { flex-grow: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; display: block; }
    .fill { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg,#FFE9B4,var(--g)); }
    .fill-done { background: linear-gradient(90deg,#A8E8C4,#4FD483); }
    .claim {
      height: 30px; padding: 0 13px; border-radius: 9px; border: 0; cursor: pointer; flex-shrink: 0;
      font: 800 10px/1 Manrope, sans-serif; letter-spacing: .1em;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 46%, #A8741F 100%); color: #2C1705;
      box-shadow: 0 3px 10px rgba(0,0,0,.45);
    }
    .claim-off {
      background: rgba(0,0,0,.4); color: rgba(243,228,196,.36);
      border: 1px solid rgba(217,170,87,.18); box-shadow: none;
    }
  </style>
</helmet>

<div class="t28" style="position: relative; width: 390px; height: 844px; overflow: hidden; --g: {{gold}};
     background: radial-gradient(120% 52% at 50% 0%, #6A3C1E 0%, #351D0F 40%, #140A05 100%);">

  <div style="position: absolute; inset: 0; opacity: .3; pointer-events: none;
       background: repeating-linear-gradient(94deg, rgba(0,0,0,.22) 0 2px, rgba(255,214,150,.04) 2px 6px, rgba(0,0,0,.1) 6px 12px, rgba(0,0,0,0) 12px 20px);"></div>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
    <linearGradient id="rg-coin" x1="4" y1="3" x2="19" y2="21">
      <stop stop-color="#FFEBB6"/><stop offset=".5" stop-color="#F0BE4C"/><stop offset="1" stop-color="#B07B1C"/>
    </linearGradient>
    <symbol id="rc-coin" viewBox="0 0 24 24">
      <ellipse cx="12" cy="17.4" rx="8.4" ry="3.4" fill="#8A5F17"/>
      <ellipse cx="12" cy="15.2" rx="8.4" ry="3.4" fill="url(#rg-coin)"/>
      <ellipse cx="12" cy="12.6" rx="8.4" ry="3.4" fill="#8A5F17"/>
      <ellipse cx="12" cy="10.4" rx="8.4" ry="3.4" fill="url(#rg-coin)"/>
      <ellipse cx="12" cy="10.4" rx="4.2" ry="1.6" fill="none" stroke="#8A5F17" stroke-width=".9" opacity=".7"/>
    </symbol>
    <symbol id="rc-chest" viewBox="0 0 24 24">
      <path d="M3 11.4a9 9 0 0 1 18 0V19a1.4 1.4 0 0 1-1.4 1.4H4.4A1.4 1.4 0 0 1 3 19z" fill="url(#rg-coin)"/>
      <path d="M3 13.6h18V19a1.4 1.4 0 0 1-1.4 1.4H4.4A1.4 1.4 0 0 1 3 19z" fill="#8A5F17"/>
      <rect x="10.4" y="12" width="3.2" height="5" rx="1" fill="#FFF3D0"/>
      <circle cx="12" cy="14.2" r="1.1" fill="#5E3F13"/>
    </symbol>
  </defs></svg>

  <!-- ============ HEADER ============ -->
  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 48px 16px 0;">
    <div style="width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer;
         background: linear-gradient(180deg, rgba(56,32,16,.9), rgba(24,13,6,.94)); border: 1px solid rgba(217,170,87,.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div class="kicker">DAY 4 STREAK</div>
      <div class="goldtext" style="font: 700 20px/1.15 Cinzel, Georgia, serif; margin-top: 5px;">Daily Rewards</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px;
         background: rgba(0,0,0,.4); border: 1px solid rgba(217,170,87,.24);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg>
      <span class="num" style="font: 700 11.5px/1 Manrope, sans-serif; color: #EEDDB6;">14:22:07</span>
    </div>
  </div>

  <!-- ============ CALENDAR ============ -->
  <div style="position: relative; padding: 20px 16px 0;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">

      <div class="day day-done">
        <span class="tick"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0F2E1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.4 4.6 4.6L19 7"/></svg></span>
        <span class="kicker" style="font-size: 7.5px;">DAY 1</span>
        <svg width="30" height="30" viewBox="0 0 24 24"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: rgba(243,228,196,.62);">200</span>
      </div>

      <div class="day day-done">
        <span class="tick"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0F2E1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.4 4.6 4.6L19 7"/></svg></span>
        <span class="kicker" style="font-size: 7.5px;">DAY 2</span>
        <svg width="30" height="30" viewBox="0 0 24 24"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: rgba(243,228,196,.62);">400</span>
      </div>

      <div class="day day-done">
        <span class="tick"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0F2E1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.4 4.6 4.6L19 7"/></svg></span>
        <span class="kicker" style="font-size: 7.5px;">DAY 3</span>
        <svg width="30" height="30" viewBox="0 0 24 24"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: rgba(243,228,196,.62);">700</span>
      </div>

      <div class="day day-live">
        <span class="kicker" style="font-size: 7.5px; color: #FFF0C8;">TODAY</span>
        <svg width="38" height="38" viewBox="0 0 24 24"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: #FFF0C8; font-size: 13px;">1,500</span>
      </div>

      <div class="day">
        <span class="kicker" style="font-size: 7.5px;">DAY 5</span>
        <svg width="30" height="30" viewBox="0 0 24 24" opacity=".78"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: rgba(243,228,196,.62);">2,000</span>
      </div>

      <div class="day">
        <span class="kicker" style="font-size: 7.5px;">DAY 6</span>
        <svg width="30" height="30" viewBox="0 0 24 24" opacity=".78"><use href="#rc-coin"></use></svg>
        <span class="amt" style="color: rgba(243,228,196,.62);">3,000</span>
      </div>
    </div>

    <!-- day 7 grand prize -->
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 9px; padding: 13px 16px; border-radius: 16px;
         background: linear-gradient(150deg, rgba(112,32,44,.85), rgba(38,12,18,.94));
         border: 1px solid rgba(217,170,87,.42); box-shadow: 0 8px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,226,168,.18);">
      <svg width="42" height="42" viewBox="0 0 24 24"><use href="#rc-chest"></use></svg>
      <div style="flex-grow: 1;">
        <div class="kicker" style="font-size: 7.5px; color: rgba(255,196,150,.8);">DAY 7 · GRAND PRIZE</div>
        <div style="font: 800 16px/1.1 Manrope, sans-serif; color: #FFF0C8; margin-top: 5px;">10,000 <span style="font-weight: 600; font-size: 12px; color: rgba(243,228,196,.55);">+ Rosewood card back</span></div>
      </div>
      <div style="text-align: right;">
        <div class="num" style="font: 800 15px/1 Manrope, sans-serif; color: var(--g);">3</div>
        <div class="kicker" style="font-size: 7px; margin-top: 4px;">DAYS</div>
      </div>
    </div>

    <div style="margin-top: 14px;">
      <button class="cta">CLAIM 1,500 COINS</button>
    </div>
  </div>

  <!-- ============ QUESTS ============ -->
  <div style="position: absolute; left: 16px; right: 16px; top: 526px; bottom: 30px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px;">
      <span class="kicker">DAILY QUESTS</span>
      <span style="font: 700 10px/1 Manrope, sans-serif; color: var(--g);">Resets in 14h</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">

      <div class="qrow">
        <div class="qico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 5.2H4.4V7a3.4 3.4 0 0 0 3 3.4M17 5.2h2.6V7a3.4 3.4 0 0 1-3 3.4"/><path d="M12 13v3.4M8.4 20h7.2l-.8-3.6H9.2z"/></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font: 700 12.5px/1.2 Manrope, sans-serif; color: #F3E4C4;">Win 3 online games</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <span class="bar"><span class="fill" style="width: 66%;"></span></span>
            <span class="num" style="font: 700 10px/1 Manrope, sans-serif; color: rgba(243,228,196,.46); flex-shrink: 0;">2/3</span>
          </div>
        </div>
        <button class="claim claim-off">500</button>
      </div>

      <div class="qrow" style="border-color: rgba(217,170,87,.42);">
        <div class="qico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 8.4 12 4l7.4 4.4v7.2L12 20l-7.4-4.4z"/><path d="M12 4v16M4.6 8.4 12 12.6l7.4-4.2"/></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font: 700 12.5px/1.2 Manrope, sans-serif; color: #F3E4C4;">Make a bid of 20 or more</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <span class="bar"><span class="fill fill-done" style="width: 100%;"></span></span>
            <span class="num" style="font: 700 10px/1 Manrope, sans-serif; color: rgba(126,214,166,.9); flex-shrink: 0;">3/3</span>
          </div>
        </div>
        <button class="claim">CLAIM</button>
      </div>

      <div class="qrow">
        <div class="qico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="5.6" width="11" height="14" rx="2"/><path d="M8.4 3.4h9a2 2 0 0 1 2 2v11"/></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font: 700 12.5px/1.2 Manrope, sans-serif; color: #F3E4C4;">Capture 12 tricks</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <span class="bar"><span class="fill" style="width: 58%;"></span></span>
            <span class="num" style="font: 700 10px/1 Manrope, sans-serif; color: rgba(243,228,196,.46); flex-shrink: 0;">7/12</span>
          </div>
        </div>
        <button class="claim claim-off">250</button>
      </div>

      <div class="qrow">
        <div class="qico">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.4" r="3.6"/><path d="M2.8 20c.5-4 3.2-6.2 6.2-6.2s5.7 2.2 6.2 6.2"/><path d="M16.4 5.2a3.4 3.4 0 0 1 0 6.6M18 20c-.3-2.8-1.4-4.8-3-6"/></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
          <div style="font: 700 12.5px/1.2 Manrope, sans-serif; color: #F3E4C4;">Play a hand with a friend</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
            <span class="bar"><span class="fill" style="width: 0%;"></span></span>
            <span class="num" style="font: 700 10px/1 Manrope, sans-serif; color: rgba(243,228,196,.46); flex-shrink: 0;">0/1</span>
          </div>
        </div>
        <button class="claim claim-off">750</button>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "gold": {"editor":"color","default":"#D9AA57","options":["#D9AA57","#E0B45E","#C9973F","#EFD79B"],"section":"Theme"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  renderVals() { return { gold: this.props.gold ?? '#D9AA57' }; }
}
</script>
</body>
</html>
