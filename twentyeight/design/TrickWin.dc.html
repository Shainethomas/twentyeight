<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    @keyframes tableflash { 0%, 62%, 100% { opacity: 0; } 8% { opacity: 1; } 34% { opacity: .5; } }
    @keyframes fly {
      0%   { transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(1); opacity: 1; }
      34%  { transform: translate(calc(var(--fx) * .3), calc(var(--fy) * .3)) rotate(0deg) scale(1.04); opacity: 1; }
      100% { transform: translate(var(--wx), var(--wy)) rotate(var(--wr)) scale(.32); opacity: 0; }
    }
    @keyframes burst {
      0%   { opacity: 0; transform: translate(0,0) scale(.2); }
      10%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
    }
    @keyframes ringout {
      0%   { opacity: .95; transform: translate(-50%,-50%) scale(.3); }
      100% { opacity: 0;   transform: translate(-50%,-50%) scale(2.1); }
    }
    @keyframes punch {
      0%   { opacity: 0; transform: scale(.2) rotate(-8deg); filter: blur(8px); }
      16%  { opacity: 1; transform: scale(1.32) rotate(2deg); filter: blur(0); }
      28%  { transform: scale(.94) rotate(0deg); }
      38%  { transform: scale(1.06); }
      48%, 76% { transform: scale(1); }
      100% { opacity: 0; transform: scale(1) translateY(-28px); }
    }
    @keyframes rollup { 0%, 30% { transform: translateY(0); } 46%, 100% { transform: translateY(-38px); } }
    @keyframes winnerbloom {
      0%, 22%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,.6); transform: scale(1); }
      34% { box-shadow: 0 0 40px rgba(217,170,87,.9), 0 6px 18px rgba(0,0,0,.6); transform: scale(1.12); }
      60% { box-shadow: 0 0 22px rgba(217,170,87,.5), 0 6px 18px rgba(0,0,0,.6); transform: scale(1.03); }
    }
    @keyframes pipfill { 0%, 30% { transform: scale(0); opacity: 0; } 46% { transform: scale(1.5); } 60%, 100% { transform: scale(1); opacity: 1; } }

    .spark { position: absolute; border-radius: 50%; pointer-events: none; }
    .flycard {
      position: absolute; left: 50%; top: 50%; margin: -40px 0 0 -28px; width: 56px; height: 80px; border-radius: 7px;
      background: linear-gradient(158deg, #FFFDF6 0%, #FBF5E7 46%, #EFE3CB 100%);
      box-shadow: 0 8px 18px rgba(0,0,0,.6), 0 0 0 1px rgba(90,60,25,.28);
      animation: fly 2.2s cubic-bezier(.35,.85,.3,1) infinite;
    }
    .av { position: relative; border-radius: 50%; }
    .av-ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 200deg, #8A6222, #F6E3B0 16%, var(--g) 36%, #6E4B14 60%, #F2DCA4 82%, #8A6222);
      animation: winnerbloom 2.2s ease-out infinite;
    }
    .av-in {
      position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
      background: radial-gradient(78% 68% at 50% 16%, #6E4226, #3E2113 70%, #24120A);
    }
    .pip { width: 7px; height: 7px; border-radius: 50%; }
  </style>
</helmet>

class Component extends DCLogic {
  renderVals() {
    const gold = this.props.gold ?? '#D9AA57';
    const n = this.props.density ?? 34;
    const tones = ['#FFF3D0', gold, '#F0BE4C', '#FFE9B4', '#FFD98A'];
    const rnd = (i, k) => { const x = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };

    const sparks = Array.from({ length: n }, (_, i) => {
      const a = (i / n) * Math.PI * 2 + rnd(i, 1) * 0.5;
      const dist = 80 + rnd(i, 2) * 96;
      const size = 2.4 + rnd(i, 3) * 5.2;
      const tone = tones[i % tones.length];
      return {
        style:
          'left:50%;top:50%;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;' +
          'background:' + tone + ';box-shadow:0 0 ' + (size * 3).toFixed(1) + 'px ' + tone + ';' +
          '--dx:' + (Math.cos(a) * dist).toFixed(1) + 'px;--dy:' + (Math.sin(a) * dist - 22).toFixed(1) + 'px;' +
          'animation:burst ' + (1.3 + rnd(i, 4) * 0.9).toFixed(2) + 's ease-out ' + (rnd(i, 5) * 0.5).toFixed(2) + 's infinite;'
      };
    });

    const usPips = Array.from({ length: 8 }, (_, i) => ({
      style: 'background:' + (i < 5 ? '#7ED6A6' : 'rgba(243,228,196,.16)') +
             (i < 5 ? ';box-shadow:0 0 7px #7ED6A6' : '') +
             (i === 4 ? ';animation:pipfill 2.2s cubic-bezier(.2,.9,.25,1) infinite' : '')
    }));
    const themPips = Array.from({ length: 8 }, (_, i) => ({
      style: 'background:' + (i < 2 ? '#E4827C' : 'rgba(243,228,196,.16)') + (i < 2 ? ';box-shadow:0 0 7px #E4827C' : '')
    }));

    return { gold, sparks, usPips, themPips };
  }
}
</script>
