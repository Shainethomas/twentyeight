<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .card {
      border-radius: 18px; padding: 15px 16px;
      background: linear-gradient(180deg, rgba(48,26,14,.9), rgba(20,11,5,.94));
      border: 1px solid rgba(217,170,87,.26);
      box-shadow: inset 0 1px 0 rgba(255,226,168,.13), 0 6px 18px rgba(0,0,0,.5);
    }
    .seg {
      flex-grow: 1; height: 42px; border-radius: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font: 700 12.5px/1 Manrope, sans-serif; color: rgba(243,228,196,.6); transition: color .14s, box-shadow .16s, background .16s;
    }
    .seg-on {
      color: #2C1705; background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 46%, #A8741F 100%);
      box-shadow: 0 3px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.6); font-weight: 800;
    }
    .segwrap {
      display: flex; gap: 4px; padding: 4px; border-radius: 14px;
      background: rgba(0,0,0,.42); border: 1px solid rgba(217,170,87,.2);
    }
    .sw { width: 46px; height: 27px; border-radius: 999px; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
    .sw-kn { position: absolute; top: 3px; width: 21px; height: 21px; border-radius: 50%; transition: left .2s cubic-bezier(.3,1,.4,1);
      background: linear-gradient(180deg,#FFFAEA,#E0CFA4); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
    .row + .row { border-top: 1px solid rgba(217,170,87,.13); }
    .cta {
      width: 100%; height: 56px; border-radius: 17px; border: 0; cursor: pointer; position: relative; overflow: hidden;
      font: 800 14px/1 Manrope, sans-serif; letter-spacing: .12em;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 42%, #A8741F 100%); color: #2C1705;
      box-shadow: 0 10px 26px rgba(0,0,0,.5), 0 0 28px rgba(217,170,87,.24), inset 0 1px 0 rgba(255,255,255,.65);
    }
    .cta::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 38%; height: 100%;
      background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.62), rgba(255,255,255,0));
      animation: sweep 3.2s ease-in-out infinite;
    }
    @keyframes sweep { 0%,60% { left: -60%; } 100% { left: 130%; } }
  </style>
</helmet>

  <div style="position: absolute; inset: 0; opacity: .3; pointer-events: none;
       background: repeating-linear-gradient(94deg, rgba(0,0,0,.22) 0 2px, rgba(255,214,150,.04) 2px 6px, rgba(0,0,0,.1) 6px 12px, rgba(0,0,0,0) 12px 20px);"></div>

  <!-- header -->
  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 48px 16px 0;">
    <div style="width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer;
         background: linear-gradient(180deg, rgba(56,32,16,.9), rgba(24,13,6,.94)); border: 1px solid rgba(217,170,87,.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div class="kicker">PRIVATE TABLE</div>
      <div class="goldtext" style="font: 700 20px/1.15 Cinzel, Georgia, serif; margin-top: 5px;">Create a Room</div>
    </div>
  </div>

  <div style="position: relative; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 14px;">

    <!-- room code -->
    <div class="card" style="display: flex; align-items: center; gap: 14px; border-color: rgba(217,170,87,.45);
         background: linear-gradient(150deg, rgba(88,58,22,.9), rgba(26,14,6,.95));">
      <div>
        <div class="kicker" style="font-size: 8.5px;">ROOM CODE</div>
        <div class="num goldtext" style="font: 700 30px/1 Cinzel, Georgia, serif; letter-spacing: .16em; margin-top: 7px;">7K4M2</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer;
             background: rgba(0,0,0,.34); border: 1px solid rgba(217,170,87,.3);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M15 6.4V5.4A2.4 2.4 0 0 0 12.6 3H5.4A2.4 2.4 0 0 0 3 5.4v7.2A2.4 2.4 0 0 0 5.4 15h1"/></svg>
        </div>
        <div style="width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer;
             background: rgba(0,0,0,.34); border: 1px solid rgba(217,170,87,.3);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.6" cy="5.6" r="2.9"/><circle cx="6.4" cy="12" r="2.9"/><circle cx="17.6" cy="18.4" r="2.9"/><path d="m9 10.6 6-3.6M9 13.4l6 3.6"/></svg>
        </div>
      </div>
    </div>

    <div>
      <div class="kicker" style="margin-bottom: 9px;">GAME LENGTH</div>
      <div class="segwrap">
        <sc-for list="{{lengths}}" as="l" hint-placeholder-count="3">
          <div class="{{l.cls}}" onClick="{{l.pick}}">{{l.label}}</div>
        </sc-for>
      </div>
    </div>

    <!-- stake -->
    <div>
      <div class="kicker" style="margin-bottom: 9px;">ENTRY STAKE</div>
      <div class="segwrap">
        <sc-for list="{{stakes}}" as="s" hint-placeholder-count="4">
          <div class="{{s.cls}}" onClick="{{s.pick}}">{{s.label}}</div>
        </sc-for>
      </div>
    </div>

    <!-- rule toggles -->
    <div class="card" style="padding: 2px 16px;">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
        <div class="row">

               border: 1.5px dashed rgba(246,227,176,.3); background: rgba(255,236,190,.05);">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgba(246,227,176,.55)" stroke-width="2" stroke-linecap="round"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>
          </div>
          <span style="font: 600 10.5px/1 Manrope, sans-serif; color: rgba(243,228,196,.4);">{{e.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px;">
    <button class="cta">INVITE &amp; START</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "gold": {"editor":"color","default":"#D9AA57","options":["#D9AA57","#E0B45E","#C9973F","#EFD79B"],"section":"Theme"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { len: '8 rounds', stake: '500', on: { 'Sixes': true, 'Double / Redouble': true, 'Auto-play last card': false, 'Spectators allowed': false } };
  }

  renderVals() {
    const gold = this.props.gold ?? '#D9AA57';

    const lengths = ['4 rounds', '8 rounds', 'First to 5'].map(label => ({
      label,
      cls: 'seg' + (this.state.len === label ? ' seg-on' : ''),
      pick: () => this.setState({ len: label })
    }));

    const stakes = ['100', '500', '2K', '10K'].map(label => ({
      label,
      cls: 'seg' + (this.state.stake === label ? ' seg-on' : ''),
      pick: () => this.setState({ stake: label })
    }));

    const ruleDefs = [
      { name: 'Sixes',                hint: 'Bids above 28 with a second trump' },
      { name: 'Double / Redouble',    hint: 'Stakes can be doubled mid-hand' },
      { name: 'Auto-play last card',  hint: 'Skip the forced final play' },
      { name: 'Spectators allowed',   hint: 'Friends can watch the table' }
    ];

    const rules = ruleDefs.map(r => {
      const on = !!this.state.on[r.name];
      return {
        name: r.name, hint: r.hint,
        trackStyle: 'background:' + (on
          ? 'linear-gradient(180deg,#FFE9B4,' + gold + ' 55%,#A8741F)'
          : 'rgba(0,0,0,.55)') + ';border:1px solid rgba(217,170,87,' + (on ? '.6' : '.24') + ')',
        knobStyle: 'left:' + (on ? '22px' : '3px'),
        toggle: () => this.setState({ on: Object.assign({}, this.state.on, { [r.name]: !on }) })
      };
    });

    return {
      gold, lengths, stakes, rules,
      empties: [{ label: 'Invite' }, { label: 'Invite' }, { label: 'Add bot' }]
    };
  }
}
</script>
</body>
</html>
