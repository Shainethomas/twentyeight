    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .av { position: relative; border-radius: 50%; flex-shrink: 0; }
    .av-in { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
      background: radial-gradient(80% 70% at 50% 20%, #A8623A, #5E2E1B 70%, #38180E); }
    .tab {
      flex-grow: 1; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font: 700 12px/1 Manrope, sans-serif; color: rgba(243,228,196,.55); transition: all .16s;
    }
    .tab-on {
      color: #2C1705; font-weight: 800;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 46%, #A8741F 100%);
      box-shadow: 0 3px 10px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.6);
    }
    .lrow {
      display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 14px;
      background: linear-gradient(180deg, rgba(48,26,14,.8), rgba(20,11,5,.88));
      border: 1px solid rgba(217,170,87,.14);
    }
    .lrow-me {
      border-color: var(--g);
      background: linear-gradient(150deg, rgba(104,68,24,.9), rgba(28,15,7,.94));
      box-shadow: 0 0 22px rgba(217,170,87,.26), inset 0 1px 0 rgba(255,226,168,.2);
    }
    .rk { width: 26px; text-align: center; font: 800 13px/1 Manrope, sans-serif; color: rgba(243,228,196,.42); flex-shrink: 0; }
    .delta { display: flex; align-items: center; gap: 3px; font: 700 9.5px/1 Manrope, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  </style>
</helmet>

      { rank: 9, name: 'Imran Sheikh', pts: '13,760', games: 344, wr: '54%', delta: 1,  up: true }
    ];

    const faces = ['#ch-shark', '#ch-colonel', '#ch-hotshot', '#ch-seth'];

    const rows = defs.map((r, i) => ({
      sym: faces[i % faces.length],
      rank: String(r.rank),
      name: r.name,
      nameColor: '#F3E4C4',
      pts: r.pts,
      games: String(r.games),
      wr: r.wr,
      delta: String(r.delta),
      arrow: r.up ? '▲' : '▼',
      dColor: r.up ? '#7ED6A6' : '#E4827C',
      cls: 'lrow',
      anim: 'animation: rise .38s cubic-bezier(.2,.9,.25,1) ' + (i * 0.05).toFixed(2) + 's backwards'
    }));

    return { gold, tabs, rows };
  }
}
</script>
