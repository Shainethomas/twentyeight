<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tab {
      flex-grow: 1; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font: 700 11.5px/1 Manrope, sans-serif; color: rgba(243,228,196,.55); transition: all .16s;
    }
    .tab-on {
      color: #2C1705; font-weight: 800;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 46%, #A8741F 100%);
      box-shadow: 0 3px 10px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.6);
    }
    .tile {
      position: relative; overflow: hidden; border-radius: 17px; padding: 13px 12px 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 9px;
      background: linear-gradient(180deg, rgba(48,26,14,.86), rgba(20,11,5,.92));
      border: 1px solid rgba(217,170,87,.2);
      box-shadow: inset 0 1px 0 rgba(255,226,168,.12), 0 6px 16px rgba(0,0,0,.45);
      transition: transform .14s, box-shadow .16s;
    }
    .tile:hover { transform: translateY(-2px); }
    .tile-hot {
      border-color: rgba(217,170,87,.55);
      background: linear-gradient(160deg, rgba(108,70,26,.9), rgba(26,14,6,.94));
      box-shadow: 0 0 26px rgba(217,170,87,.26), inset 0 1px 0 rgba(255,226,168,.22), 0 6px 16px rgba(0,0,0,.45);
    }
    .ribbon {
      position: absolute; top: 10px; right: -26px; width: 96px; transform: rotate(38deg); text-align: center;
      font: 800 8px/17px Manrope, sans-serif; letter-spacing: .14em; color: #2C1705;
      background: linear-gradient(180deg, #FFE9B4, var(--g) 60%, #A8741F);
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .ribbon-hot { color: #FFF0DC; background: linear-gradient(180deg, #E4525C, #9C1B26); }
    .buy {
      width: 100%; height: 34px; border-radius: 10px; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font: 800 11.5px/1 Manrope, sans-serif;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 46%, #A8741F 100%); color: #2C1705;
      box-shadow: 0 3px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55);
    }
    .buy-owned { background: rgba(0,0,0,.42); color: rgba(126,214,166,.85); border: 1px solid rgba(126,214,166,.3); box-shadow: none; }
    .buy-cash { background: linear-gradient(180deg, #7ED6A6, #2F8A5C); color: #06281A; }
    .cardback {
      width: 58px; height: 82px; border-radius: 7px;
      box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 0 0 1px rgba(246,227,176,.34), inset 0 0 0 4px rgba(0,0,0,.2), inset 0 0 0 5px rgba(246,227,176,.2);
    }
  </style>
</helmet>

<div class="t28" style="position: relative; width: 390px; height: 844px; overflow: hidden; --g: {{gold}};
     background: radial-gradient(120% 50% at 50% 0%, #6A3C1E 0%, #351D0F 40%, #140A05 100%);">

  <div style="position: absolute; inset: 0; opacity: .28; pointer-events: none;
       background: repeating-linear-gradient(94deg, rgba(0,0,0,.22) 0 2px, rgba(255,214,150,.04) 2px 6px, rgba(0,0,0,.1) 6px 12px, rgba(0,0,0,0) 12px 20px);"></div>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
    <linearGradient id="sh-coin" x1="4" y1="3" x2="19" y2="21">
      <stop stop-color="#FFEBB6"/><stop offset=".5" stop-color="#F0BE4C"/><stop offset="1" stop-color="#B07B1C"/>
    </linearGradient>
    <symbol id="sh-stack" viewBox="0 0 24 24">
      <ellipse cx="12" cy="18" rx="8.6" ry="3.4" fill="#8A5F17"/>
      <ellipse cx="12" cy="15.6" rx="8.6" ry="3.4" fill="url(#sh-coin)"/>
      <ellipse cx="12" cy="12.8" rx="8.6" ry="3.4" fill="#8A5F17"/>
      <ellipse cx="12" cy="10.6" rx="8.6" ry="3.4" fill="url(#sh-coin)"/>
      <ellipse cx="12" cy="8" rx="8.6" ry="3.4" fill="#8A5F17"/>
      <ellipse cx="12" cy="5.8" rx="8.6" ry="3.4" fill="url(#sh-coin)"/>
    </symbol>
    <symbol id="sh-coin1" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="url(#sh-coin)"/>
      <circle cx="12" cy="12" r="9" fill="none" stroke="#8A5F17" stroke-width="1.3"/>
      <circle cx="12" cy="12" r="5.4" fill="none" stroke="#8A5F17" stroke-width="1.1" opacity=".75"/>
    </symbol>
  </defs></svg>

  <!-- ============ HEADER ============ -->
  <div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 48px 16px 0;">
    <div style="width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
         background: linear-gradient(180deg, rgba(56,32,16,.9), rgba(24,13,6,.94)); border: 1px solid rgba(217,170,87,.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6CE97" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div class="kicker">STORE</div>
      <div class="goldtext" style="font: 700 20px/1.15 Cinzel, Georgia, serif; margin-top: 5px;">Shop</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px;
         background: rgba(0,0,0,.44); border: 1px solid rgba(217,170,87,.3);">
      <svg width="15" height="15" viewBox="0 0 24 24"><use href="#sh-coin1"></use></svg>
      <span class="num" style="font: 800 12.5px/1 Manrope, sans-serif; color: #FBEBC6;">12,480</span>
    </div>
  </div>

  <div style="position: relative; margin: 16px 16px 0; display: flex; gap: 4px; padding: 4px; border-radius: 14px;
       background: rgba(0,0,0,.42); border: 1px solid rgba(217,170,87,.18);">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <div class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</div>
    </sc-for>
  </div>

  <!-- ============ FEATURED ============ -->
  <div style="position: relative; margin: 16px 16px 0; padding: 16px; border-radius: 20px; overflow: hidden;
       background: linear-gradient(140deg, rgba(122,32,46,.92) 0%, rgba(74,20,30,.94) 46%, rgba(26,12,8,.96) 100%);
       border: 1px solid rgba(217,170,87,.45);
       box-shadow: 0 14px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,226,168,.2);">
    <div style="position: absolute; right: -30px; top: -30px; width: 170px; height: 170px; border-radius: 50%;
         background: radial-gradient(circle, rgba(255,206,124,.26), rgba(255,206,124,0) 70%);"></div>

    <div style="position: relative; display: flex; align-items: center; gap: 14px;">
      <div style="position: relative; width: 86px; height: 86px; flex-shrink: 0;">
        <div class="cardback" style="position: absolute; left: 2px; top: 4px; transform: rotate(-14deg); width: 52px; height: 74px;
             background: repeating-linear-gradient(45deg, rgba(255,235,190,.1) 0 3px, rgba(0,0,0,0) 3px 6px), radial-gradient(75% 65% at 50% 30%, #8E2233, #56121F 60%, #310A12);"></div>
        <div class="cardback" style="position: absolute; left: 20px; top: 0; transform: rotate(9deg); width: 52px; height: 74px;
             background: repeating-linear-gradient(45deg, rgba(255,235,190,.14) 0 3px, rgba(0,0,0,0) 3px 6px), radial-gradient(75% 65% at 50% 30%, #6A4A1E, #3E2A0F 60%, #1E1206);"></div>
      </div>

      <div style="flex-grow: 1; min-width: 0;">
        <div class="kicker" style="font-size: 7.5px; color: rgba(255,196,150,.85);">LIMITED · 2 DAYS LEFT</div>
        <div style="font: 800 17px/1.15 Manrope, sans-serif; color: #FFF0C8; margin-top: 6px;">Maharaja Bundle</div>
        <div style="font: 600 11px/1.35 Manrope, sans-serif; color: rgba(243,228,196,.55); margin-top: 5px;">3 card backs · rosewood table · 25,000 coins</div>
        <div style="display: flex; align-items: center; gap: 9px; margin-top: 11px;">
          <span style="font: 600 12px/1 Manrope, sans-serif; color: rgba(243,228,196,.4); text-decoration: line-through;">₹899</span>
          <span class="goldtext" style="font: 800 19px/1 Manrope, sans-serif;">₹449</span>
          <span style="padding: 3px 7px; border-radius: 6px; font: 800 9px/1 Manrope, sans-serif; letter-spacing: .06em;
                background: linear-gradient(180deg,#E4525C,#9C1B26); color: #FFF0DC;">−50%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ GRID ============ -->
  <div style="position: absolute; left: 16px; right: 16px; top: 400px; bottom: 30px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px;">
      <span class="kicker">COIN PACKS</span>
      <span style="font: 600 10px/1 Manrope, sans-serif; color: rgba(243,228,196,.35);">Best value marked</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">

      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24"><use href="#sh-coin1"></use></svg>
        <div style="text-align: center;">
          <div class="num" style="font: 800 14px/1 Manrope, sans-serif; color: #F3E4C4;">5,000</div>
          <div class="kicker" style="font-size: 7px; margin-top: 4px;">COINS</div>
        </div>
        <button class="buy buy-cash">₹79</button>
      </div>

      <div class="tile tile-hot">
        <span class="ribbon">BEST</span>
        <svg width="42" height="42" viewBox="0 0 24 24"><use href="#sh-stack"></use></svg>
        <div style="text-align: center;">
          <div class="num goldtext" style="font: 800 14px/1 Manrope, sans-serif;">30,000</div>
          <div class="kicker" style="font-size: 7px; margin-top: 4px; color: var(--g);">+15% BONUS</div>
        </div>
        <button class="buy buy-cash">₹349</button>
      </div>

      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24"><use href="#sh-stack"></use></svg>
        <div style="text-align: center;">
          <div class="num" style="font: 800 14px/1 Manrope, sans-serif; color: #F3E4C4;">90,000</div>
          <div class="kicker" style="font-size: 7px; margin-top: 4px;">COINS</div>
        </div>
        <button class="buy buy-cash">₹899</button>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 11px;">
      <span class="kicker">CARD BACKS</span>
      <span style="font: 700 10px/1 Manrope, sans-serif; color: var(--g);">7 owned</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">

      <div class="tile">
        <div class="cardback" style="background: repeating-linear-gradient(45deg, rgba(255,235,190,.1) 0 3px, rgba(0,0,0,0) 3px 6px), repeating-linear-gradient(-45deg, rgba(255,235,190,.1) 0 3px, rgba(0,0,0,0) 3px 6px), radial-gradient(75% 65% at 50% 30%, #8E2233, #56121F 60%, #310A12);"></div>
        <div style="font: 700 11px/1 Manrope, sans-serif; color: #F3E4C4;">Classic Red</div>
        <button class="buy buy-owned">OWNED</button>
      </div>

      <div class="tile tile-hot">
        <span class="ribbon ribbon-hot">NEW</span>
        <div class="cardback" style="background: repeating-linear-gradient(0deg, rgba(255,235,190,.12) 0 2px, rgba(0,0,0,0) 2px 7px), radial-gradient(75% 65% at 50% 30%, #1E6B4D, #124834 60%, #07231A);"></div>
        <div style="font: 700 11px/1 Manrope, sans-serif; color: #F3E4C4;">Peacock</div>
        <button class="buy">
          <svg width="12" height="12" viewBox="0 0 24 24"><use href="#sh-coin1"></use></svg>
          <span class="num">4,500</span>
        </button>
      </div>

      <div class="tile">
        <div class="cardback" style="background: repeating-linear-gradient(45deg, rgba(255,235,190,.16) 0 2px, rgba(0,0,0,0) 2px 8px), radial-gradient(75% 65% at 50% 30%, #7A5A22, #46320F 60%, #221706);"></div>
        <div style="font: 700 11px/1 Manrope, sans-serif; color: #F3E4C4;">Gold Leaf</div>
        <button class="buy">
          <svg width="12" height="12" viewBox="0 0 24 24"><use href="#sh-coin1"></use></svg>
          <span class="num">9,000</span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "gold": {"editor":"color","default":"#D9AA57","options":["#D9AA57","#E0B45E","#C9973F","#EFD79B"],"section":"Theme"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Featured' }; }

  renderVals() {
    const tabs = ['Featured', 'Coins', 'Cosmetics'].map(label => ({
      label,
      cls: 'tab' + (this.state.tab === label ? ' tab-on' : ''),
      pick: () => this.setState({ tab: label })
    }));
    return { gold: this.props.gold ?? '#D9AA57', tabs };
  }
}
</script>
</body>
</html>
