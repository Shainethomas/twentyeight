<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Manrope, "Avenir Next", "Segoe UI", sans-serif; }
    a { color: #D9AA57; } a:hover { color: #F6E3B0; }
    .t28 * { box-sizing: border-box; }
    .kicker { font: 700 9px/1 Manrope, sans-serif; letter-spacing: .22em; color: rgba(243,228,196,.6); }
    .num { font-variant-numeric: tabular-nums; }
    .goldtext {
      background: linear-gradient(178deg, #FFF6DA 0%, var(--g) 40%, #A9761F 72%, #FFF1CB 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .av { position: relative; border-radius: 50%; flex-shrink: 0; }
    .av-ring { position: absolute; inset: -2.5px; border-radius: 50%;
      background: conic-gradient(from 200deg, #8A6222, #F6E3B0 18%, var(--g) 38%, #6E4B14 62%, #F2DCA4 84%, #8A6222); }
    .av-in { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
      background: radial-gradient(80% 70% at 50% 20%, #A8623A, #5E2E1B 70%, #38180E); }
    .stat {
      flex-grow: 1; padding: 11px 8px; border-radius: 14px; text-align: center;
      background: rgba(0,0,0,.36); border: 1px solid rgba(217,170,87,.18);
    }
    .cta {
      flex-grow: 1; height: 56px; border-radius: 17px; border: 0; cursor: pointer; position: relative; overflow: hidden;
      font: 800 13.5px/1 Manrope, sans-serif; letter-spacing: .12em;
      background: linear-gradient(180deg, #FFE9B4 0%, var(--g) 42%, #A8741F 100%); color: #2C1705;
      box-shadow: 0 10px 26px rgba(0,0,0,.5), 0 0 28px rgba(217,170,87,.24), inset 0 1px 0 rgba(255,255,255,.65);
    }
    .cta::after {
      content: ""; position: absolute; top: 0; left: -60%; width: 38%; height: 100%;
      background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.62), rgba(255,255,255,0));
      animation: sweep 3.2s ease-in-out infinite;
    }
    .cta-ghost {
      width: 112px; height: 56px; border-radius: 17px; cursor: pointer;
      background: linear-gradient(180deg, rgba(58,33,16,.9), rgba(24,13,6,.94));
      border: 1px solid rgba(217,170,87,.3); color: #E6CE97; font: 800 13px/1 Manrope, sans-serif; letter-spacing: .1em;
    }
    @keyframes sweep { 0%,60% { left: -60%; } 100% { left: 130%; } }
    @keyframes stampin { 0% { opacity: 0; transform: scale(1.4); filter: blur(6px); } 60% { opacity: 1; transform: scale(.97); filter: blur(0); } 100% { transform: scale(1); } }
    @keyframes fall { to { transform: translateY(720px) rotate(var(--r)); opacity: 0; } }
    @keyframes rowin { from { opacity: 0; transform: translateY(14px); } }
  </style>
</helmet>

  <!-- ============ VERDICT ============ -->

    <div style="display: flex; align-items: center; justify-content: center; gap: 26px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">

<script data-dc-script data-props='{
  "gold": {"editor":"color","default":"#D9AA57","options":["#D9AA57","#E0B45E","#C9973F","#EFD79B"],"section":"Theme"},
  "$preview": {"width":390,"height":844}
}'>
class Component extends DCLogic {
  renderVals() {
    const gold = this.props.gold ?? '#D9AA57';
    const win = '#7ED6A6', lose = '#E4827C';

    const rnd = (i, k) => { const x = Math.sin((i + 1) * 91.7 + k * 33.3) * 9137.31; return x - Math.floor(x); };
    const tones = ['#FFF3D0', gold, '#F0BE4C', '#E4525C', '#FFE9B4'];
    const confetti = Array.from({ length: 22 }, (_, i) => {
      const w = 4 + rnd(i, 1) * 5;
      return {
        style: 'position:absolute;top:-30px;left:' + (rnd(i, 2) * 100).toFixed(1) + '%;' +
               'width:' + w.toFixed(1) + 'px;height:' + (w * 1.9).toFixed(1) + 'px;border-radius:1.5px;' +
               'background:' + tones[i % tones.length] + ';opacity:.85;--r:' + (400 + rnd(i, 3) * 500).toFixed(0) + 'deg;' +
               'animation:fall ' + (3.4 + rnd(i, 4) * 2.6).toFixed(2) + 's linear ' + (rnd(i, 5) * 3).toFixed(2) + 's infinite;'
      };
    });

    const defs = [
      { n: 4, who: 'Kunjappan', bid: 16, delta: -16 },
      { n: 5, who: 'You',    bid: 18, delta: +18 },
      { n: 6, who: 'Rohan',     bid: 20, delta: -20 },
      { n: 7, who: 'Colonel',   bid: 14, delta: +14 },
      { n: 8, who: 'Kunjappan', bid: 20, delta: +22 }
    ];

    const rounds = defs.map((r, i) => ({
      n: String(r.n), who: r.who, bid: String(r.bid),
      delta: (r.delta > 0 ? '+' : '') + r.delta,
      color: r.delta > 0 ? win : lose,
      rowStyle: 'display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:11px;' +
                'background:rgba(0,0,0,' + (i === defs.length - 1 ? '.5' : '.3') + ');' +
                'border:1px solid rgba(217,170,87,' + (i === defs.length - 1 ? '.4' : '.12') + ');' +
                'animation:rowin .4s cubic-bezier(.2,.9,.25,1) ' + (0.3 + i * 0.07).toFixed(2) + 's backwards'
    }));

    return { gold, confetti, rounds };
  }
}
</script>
